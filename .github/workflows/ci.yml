# Checks every pull request; reused by deploy.yml so that what is checked
# is exactly what is published.
# Implements FR12, FR14, NFR-P1 of setup-app-shell-and-pages-deploy (D10, D11).
# Implements FR1–FR7, NFR-P1 of add-pr-preview-deploy (D1–D5).
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the production build as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build, E2E
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check initial JS budget
        run: pnpm --filter @time-zones/client check:bundle-size

      - name: Check that the build left sources untouched
        run: git diff --exit-code

      # No --with-deps: the runner image already ships the system libraries
      # Chromium needs (it has Google Chrome), and apt mirrors can be slow
      - name: Install Playwright Chromium
        run: pnpm --filter @time-zones/client exec playwright install chromium

      - name: Smoke E2E
        run: pnpm --filter @time-zones/client test:bdd

      - name: Upload preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: packages/client/dist
          retention-days: 1

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/client/playwright-report
            packages/client/cucumber-report
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/client/dist

  # Real timings with warm-up and medians; over-budget medians only warn.
  # Runs on its own runner and never fails the pull request check.
  # implements FR7 of replace-wall-clock-row-budgets-with-deterministic-checks
  benchmark:
    name: Benchmark (non-blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    concurrency:
      group: bench-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        run: pnpm --filter @time-zones/client bench

      - name: Report benchmark budgets
        if: always()
        run: node packages/client/scripts/check-bench-budgets.mjs packages/client/reports/bench/bench.json

  # Draft Netlify deploy of the tested build, linked in one PR comment.
  # Never blocks the pull request check and is skipped without the secrets.
  preview:
    name: PR preview
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check preview secrets
        id: preview-secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          available=true
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::notice::Preview skipped: NETLIFY_AUTH_TOKEN is not set"
            available=false
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::Preview skipped: NETLIFY_SITE_ID is not set"
            available=false
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.preview-secrets.outputs.available == 'true'

      - uses: actions/setup-node@v5
        if: steps.preview-secrets.outputs.available == 'true'
        with:
          node-version-file: .nvmrc
          # packageManager in package.json would make setup-node look for pnpm, which this job never installs
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        if: steps.preview-secrets.outputs.available == 'true'
        with:
          name: preview-build
          path: packages/client/dist

      - name: Assemble preview site
        if: steps.preview-secrets.outputs.available == 'true'
        run: node packages/client/scripts/assemble-preview-site.mjs packages/client/dist preview-site

      - name: Deploy preview to Netlify
        if: steps.preview-secrets.outputs.available == 'true'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: preview-site
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          enable-pull-request-comment: true
          overwrites-pull-request-comment: true
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
