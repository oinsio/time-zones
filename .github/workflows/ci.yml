# Checks every pull request; reused by deploy.yml so that what is checked
# is exactly what is published.
# Implements FR12, FR14, NFR-P1 of setup-app-shell-and-pages-deploy (D10, D11).
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the production build as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check initial JS budget
        run: pnpm --filter @time-zones/client check:bundle-size

      - name: Check that the build left sources untouched
        run: git diff --exit-code

      - name: Install Playwright Chromium
        run: pnpm --filter @time-zones/client exec playwright install --with-deps chromium

      - name: Smoke E2E
        run: pnpm --filter @time-zones/client test:bdd

      # The same pinned Playwright image every developer checks baselines with.
      - name: Screenshot E2E
        run: pnpm --filter @time-zones/client test:screenshots

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/client/playwright-report
            packages/client/cucumber-report
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/client/dist
