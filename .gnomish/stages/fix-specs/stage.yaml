# Stage goal, shown to the gnome.
purpose: triage every finding in the change's review-specs.md, revise the change's artifacts for the ones worth fixing, reject the rest with evidence, and leave the change valid
# The checkout, plus the change and the review of it.
inputs:
  - kind: source
  - kind: internal
    producerOutputId: openspec-change
  - kind: internal
    producerOutputId: spec-review-report
# Name of what the stage produces.
outputs:
  - id: spec-review-resolution
# Who does the work: a Claude Code CLI agent.
executor:
  type: agent-cli
  model: sonnet
  # Only these four keys are accepted.
  settings:
    # Agent turns per round.
    maxTurns: 40
    # Round is killed after this; counts as infra failure, not an attempt.
    roundTimeout: 1200s
    # Cannot widen what .claude/settings.json denies.
    allowedTools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      - Bash
      - Skill
    # No subagents, no web, no scheduling.
    disallowedTools:
      - Agent
      - ScheduleWakeup
      - SendMessage
      - ToolSearch
      - WebFetch
      - WebSearch
# Prompt for the gnome.
instructions: stages/fix-specs/instructions.md
# Run in order after each round (sh -c, POSIX); a failure is fed back and burns an attempt.
verify:
  # Exactly one active change; every finding carries a final status and a resolution.
  - type: command
    command: |
      change=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive)
      [ "$(printf '%s\n' "$change" | grep -c .)" = "1" ] || { echo "expected exactly one active change under openspec/changes/, found: $change"; exit 1; }
      review="$change/review-specs.md"
      [ -f "$review" ] || { echo "$review is missing - the review-specs stage left it there; restore it from git"; exit 1; }
      open=$(grep -nE '^- Status: open' "$review" || true)
      [ -z "$open" ] || { echo "$open"; echo "these findings are still open - fix or reject each one, see stages/fix-specs/instructions.md"; exit 1; }
      bad=$(grep -nE '^- Status: ' "$review" | grep -vE '^[0-9]+:- Status: (fixed|rejected \((false-positive|contradicts-spec|harmful|out-of-scope|not-worth-it)\))$' || true)
      [ -z "$bad" ] || { echo "$bad"; echo "a status reads 'fixed' or 'rejected (false-positive|contradicts-spec|harmful|out-of-scope|not-worth-it)'"; exit 1; }
      findings=$(grep -cE '^### R[0-9]+ — ' "$review" || true)
      resolutions=$(grep -cE '^- Resolution: .{20,}' "$review" || true)
      [ "$resolutions" = "$findings" ] || { echo "$review has $findings findings but $resolutions '- Resolution:' lines of substance - every finding gets one, right after its Status"; exit 1; }
  # Everything this branch changed so far lives inside the change directory: specify,
  # review-specs and fix-specs write specifications only.
  - type: command
    command: |
      change=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive)
      base=$(git merge-base HEAD origin/main)
      outside=$({ git diff --name-only "$base"; git ls-files -o --exclude-standard; } | sort -u | grep -v "^$change/" | grep -v '^\.gnomish-task/' || true)
      [ -z "$outside" ] || { echo "$outside"; echo "the fix-specs stage revises only files under $change/ - restore the files above with: git checkout $base -- <file>"; exit 1; }
  # OpenSpec's own strict validation, as after specify.
  - type: command
    command: openspec validate --changes --strict --no-interactive
  # proposal.md still has required sections and FR/M ids.
  - type: command
    command: >-
      change=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive);
      proposal="$change/proposal.md";
      for section in '## Why' '## What Changes' '## Goals' '## Non-Goals' '## Requirements' '## Success Metrics'; do
        grep -q "^$section" "$proposal" || { echo "$proposal has no '$section' section — see .claude/rules/proposal-format.md"; exit 1; };
      done;
      grep -qE '(^|[^A-Za-z])FR[0-9]+' "$proposal" || { echo "$proposal declares no FR<n> requirement id — every requirement needs one, see .claude/rules/traceability.md"; exit 1; };
      grep -qE '(^|[^A-Za-z])M[0-9]+' "$proposal" || { echo "$proposal declares no M<n> success metric id — see .claude/rules/traceability.md"; exit 1; }
  # LLM judge checks each revision and challenges each rejection; read-only. Opus, like the
  # reviewer: it arbitrates between the reviewer and the fixer.
  - type: judge
    criteriaFile: stages/fix-specs/acceptance.md
    model: opus
    settings:
      maxTurns: 20
      disallowedTools:
        - Bash
        - Agent
        - ScheduleWakeup
        - SendMessage
        - ToolSearch
        - Edit
        - Write
        - WebFetch
        - WebSearch
    # Judge runs; must be odd, majority wins.
    votes: 1
# auto = go to next stage; manual = wait for a human.
advancement: auto
