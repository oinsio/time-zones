# Stage goal, shown to the gnome.
purpose: archive this task's completed OpenSpec change under openspec/changes/archive/YYYY/MM/ and fold its spec deltas into openspec/specs/
# The checkout, plus what the specify and implement stages produced.
inputs:
  - kind: source
  - kind: internal
    producerOutputId: openspec-change
  - kind: internal
    producerOutputId: implementation-diff
# Name of what the stage produces.
outputs:
  - id: archived-change
# Who does the work: a Claude Code CLI agent.
executor:
  type: agent-cli
  model: sonnet
  # Only these four keys are accepted.
  settings:
    # Agent turns per round.
    maxTurns: 15
    # Round is killed after this; counts as infra failure, not an attempt.
    roundTimeout: 600s
    # Cannot widen what .claude/settings.json denies.
    allowedTools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      - Bash
    # No subagents, no web, no scheduling.
    disallowedTools:
      - Agent
      - ScheduleWakeup
      - SendMessage
      - ToolSearch
      - WebFetch
      - WebSearch
# Prompt for the gnome.
instructions: stages/archive/instructions.md
# Run in order after each round (sh -c, POSIX); a failure is fed back and burns an attempt.
verify:
  # This task's change is no longer active and sits exactly once under archive/YYYY/MM/. Other
  # active changes on the base are someone else's and stay where they are.
  - type: command
    command: |
      . .gnomish/lib/task-change.sh
      if [ -e "$change" ]; then
        echo "$change is still active - archive it with: openspec archive $change_name --yes, then move it under openspec/changes/archive/YYYY/MM/"
        exit 1
      fi
      # Measured from the merge base, so an earlier archive of the same name does not count.
      base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD)
      targets=$({ git diff --name-only "$base"; git ls-files --others --exclude-standard; } \
        | grep -E "^openspec/changes/archive/[0-9]{4}/[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}-$change_name/proposal\.md$" \
        | sort -u | sed 's|/proposal\.md$||')
      count=$(printf '%s' "$targets" | grep -c . || true)
      [ "$count" = "1" ] || { echo "expected exactly one new openspec/changes/archive/YYYY/MM/YYYY-MM-DD-$change_name/ holding the change's proposal.md, found $count:"; echo "$targets"; exit 1; }
  # Archive layout from .claude/rules/archive-path.md: archive/YYYY/MM/YYYY-MM-DD-<name>.
  - type: command
    command: >-
      misplaced=$(find openspec/changes/archive -mindepth 1 -maxdepth 1 -type d ! -name '[0-9][0-9][0-9][0-9]';
      find openspec/changes/archive -mindepth 2 -maxdepth 2 -type d ! -name '[0-1][0-9]';
      find openspec/changes/archive -mindepth 3 -maxdepth 3 -type d ! -name '[0-9][0-9][0-9][0-9]-[0-1][0-9]-[0-3][0-9]-*');
      [ -z "$misplaced" ] || { echo "$misplaced"; echo "these archive entries break the YYYY/MM/YYYY-MM-DD-<name> layout - see .claude/rules/archive-path.md"; exit 1; }
  # Every archived change is complete. `openspec validate --archived` does not descend into
  # the YYYY/MM grouping, so the checkboxes are checked directly.
  - type: command
    command: >-
      if grep -rn '^[[:space:]]*- \[ \]' openspec/changes/archive --include=tasks.md;
      then echo "the archived tasks listed above are still open - the change was archived unfinished"; exit 1; fi
  - type: command
    command: openspec validate --specs --strict --no-interactive
  # Archiving touches nothing outside openspec/.
  - type: command
    command: |
      since=$(git log --format='%H %s' | awk '$2 == "gnomish:" && $3 == "round" && $4 !~ /^archive#/ { print $1; exit }')
      [ -n "$since" ] || since=$(git merge-base HEAD origin/main)
      changed=$({ git diff --name-only "$since"; git ls-files -o --exclude-standard; } | sort -u | grep -v '^\.gnomish-task/' || true)
      outside=$(printf '%s\n' "$changed" | grep . | grep -v '^openspec/' || true)
      [ -z "$outside" ] || { echo "$outside"; echo "the archive stage changes nothing outside openspec/ - restore the files above with: git checkout $since -- <file>"; exit 1; }
  # LLM judge grades the archive against acceptance.md; read-only.
  - type: judge
    criteriaFile: stages/archive/acceptance.md
    model: sonnet
    settings:
      # A turn per file read; 10 leaves no slack on a feature-sized change.
      maxTurns: 20
      disallowedTools:
        - Bash
        - Agent
        - ScheduleWakeup
        - SendMessage
        - ToolSearch
        - Edit
        - Write
        - WebFetch
        - WebSearch
    # Judge runs; must be odd, majority wins.
    votes: 1
# auto = go to next stage; manual = wait for a human.
advancement: auto
