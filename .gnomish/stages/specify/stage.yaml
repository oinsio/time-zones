# Stage goal, shown to the gnome.
purpose: turn the task into one complete, validated OpenSpec change under openspec/changes/ - a new one, or the existing change the task names - and record which change this task works on
# What this stage leaves behind:
#   finished  -> the change under openspec/changes/<name>/, and temporary-docs/gnomish/<task>/change.md:
#                the task's change record. Its `Change:` line is how every later stage learns which
#                change this task works on (.gnomish/lib/task-change.sh); other active changes on the
#                base are someone else's and stay untouched.
#   could not -> a question in the tracker thread: an ambiguous change name, a change blocked by
#                another active change that has not landed, and no change record at all.
# Works on the repository checkout of the task.
inputs:
  - kind: source
# Name of what the stage produces.
outputs:
  - id: openspec-change
# Who does the work: a Claude Code CLI agent. Opus: the specification is the contract every
# later stage builds on, and sonnet skipped the required reading and let the judge find the gaps.
executor:
  type: agent-cli
  model: opus
  # Only these four keys are accepted.
  settings:
    # Agent turns per round: the required reading (ADRs, rules, overview) comes first.
    # 60 ran out on task #18 (a whole-feature change) before the round could finish.
    maxTurns: 120
    # Round is killed after this; counts as infra failure, not an attempt.
    # 60 turns took about 9 minutes on task #18; doubled along with the turns.
    roundTimeout: 2400s
    # Cannot widen what .claude/settings.json denies.
    allowedTools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      - Bash
      - Skill
    # No subagents, no web, no scheduling.
    disallowedTools:
      - Agent
      - ScheduleWakeup
      - SendMessage
      - ToolSearch
      - WebFetch
      - WebSearch
# Prompt for the gnome.
instructions: stages/specify/instructions.md
# Run in order after each round; a failure is fed back and burns an attempt.
verify:
  # The change record names an active change, and its verdict says work on it may start.
  # A blocked change leaves through the decision file, not through here.
  - type: command
    command: |
      . .gnomish/lib/task-change.sh
      [ -f "$change/proposal.md" ] || { echo "$record names change '$change_name', but $change/proposal.md does not exist - write the change there, or name the active change the task is about"; exit 1; }
      verdict=$(sed -n 's/^Verdict:[[:space:]]*//p' "$record" | head -1)
      if [ "$verdict" != "no-blocking-dependencies" ]; then
        echo "the change record's verdict is '$verdict'; the only verdict that finishes this stage is 'no-blocking-dependencies'."
        echo "If the change IS blocked, do not finish the round: write the dependency chain to the path in \$GNOMISH_DECISION_FILE as {\"question\": \"...\", \"options\": [\"...\"]}, delete $record and end your turn."
        exit 1
      fi
  # OpenSpec's own strict validation, of this task's change only: other active changes are not
  # this task's to fix.
  - type: command
    command: |
      . .gnomish/lib/task-change.sh
      openspec validate "$change_name" --type change --strict --no-interactive
  # proposal.md has required sections and FR/M ids.
  - type: command
    command: >-
      . .gnomish/lib/task-change.sh;
      proposal="$change/proposal.md";
      for section in '## Why' '## What Changes' '## Goals' '## Non-Goals' '## Requirements' '## Success Metrics'; do
        grep -q "^$section" "$proposal" || { echo "$proposal has no '$section' section — see .claude/rules/proposal-format.md"; exit 1; };
      done;
      grep -qE '(^|[^A-Za-z])FR[0-9]+' "$proposal" || { echo "$proposal declares no FR<n> requirement id — every requirement needs one, see .claude/rules/traceability.md"; exit 1; };
      grep -qE '(^|[^A-Za-z])M[0-9]+' "$proposal" || { echo "$proposal declares no M<n> success metric id — see .claude/rules/traceability.md"; exit 1; }
  # The stage writes specifications only: nothing outside the one change directory and the
  # change record.
  - type: command
    command: |
      . .gnomish/lib/task-change.sh
      # Where the task branch started: the box has no origin, so never origin/main.
      start=$(git log --format='%H %s' | awk '$2 == "gnomish:" && $3 == "task" && $4 == "started" { print $1; exit }')
      base=$(git rev-parse "$start^" 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null) || { echo "cannot tell where this task branch started: no 'gnomish: task started' commit and no origin/main"; exit 1; }
      outside=$({ git diff --name-only "$base"; git ls-files -o --exclude-standard; } | sort -u | grep -v "^$change/" | grep -vxF "$record" | grep -v '^\.gnomish-task/' || true)
      [ -z "$outside" ] || { echo "$outside"; echo "the specify stage writes only under $change/ and $record - if you made the edits above, undo each of them yourself with: git checkout $base -- <file>; other active changes are someone else's work and stay exactly as they are"; exit 1; }
  # LLM judge grades the change against acceptance.md; read-only. Opus with room to open
  # the ADRs, the rules and the code: a design that breaks the architecture or states
  # stale facts about the code costs every later stage.
  - type: judge
    criteriaFile: stages/specify/acceptance.md
    model: opus
    settings:
      # Room to check every criterion, not just the first few findings. The judge is read-only
      # (Read/Grep/Glob only, hard-wired by the factory) and pays a turn per file it opens; the
      # implement judge ran out at 30 on a 187-file change and escalated without a verdict.
      maxTurns: 60
      disallowedTools:
        - Bash
        - Agent
        - ScheduleWakeup
        - SendMessage
        - ToolSearch
        - Edit
        - Write
        - WebFetch
        - WebSearch
    # Judge runs; must be odd, majority wins.
    votes: 1
# auto = go to next stage; manual = wait for a human.
# manual parks the task as gnomish:needs-human (checkpoint). To continue:
#   tracker: move the issue back to gnomish:ready (no reply needed);
#   local: gnomish run --dir=<path-to-time-zones-clone> --resume=<task>, then confirm.
advancement: auto
# A large change needs more rounds: each verdict names real defects the previous one
# did not, and on task #16 the gnome closed every listed finding yet ran out of attempts.
autonomy:
  attemptLimit: 4
