# Stage goal, shown to the gnome.
purpose: implement the OpenSpec change from the specify stage in packages/client with TDD and keep CI green
# The checkout, plus the change the specify stage produced, as revised by fix-specs.
inputs:
  - kind: source
  - kind: internal
    producerOutputId: openspec-change
  - kind: internal
    producerOutputId: spec-review-resolution
# Name of what the stage produces.
outputs:
  - id: implementation-diff
# Who does the work: a Claude Code CLI agent.
executor:
  type: agent-cli
  model: sonnet
  # Only these four keys are accepted.
  settings:
    # Agent turns per round. TDD, hooks and scoped mutation runs are turn-hungry.
    maxTurns: 80
    # Round is killed after this; counts as infra failure, not an attempt.
    # pnpm install + the test hook after every edit + scoped Stryker runs.
    roundTimeout: 3600s
    # Cannot widen what .claude/settings.json denies.
    allowedTools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      - Bash
      - Skill
    # No subagents, no web, no scheduling.
    disallowedTools:
      - Agent
      - ScheduleWakeup
      - SendMessage
      - ToolSearch
      - WebFetch
      - WebSearch
# Prompt for the gnome.
instructions: stages/implement/instructions.md
# Run in order after each round (sh -c, POSIX), cheap to expensive, one at a time — the same
# steps as .github/workflows/ci.yml. A failure is fed back and burns an attempt.
verify:
  # The worktree starts without node_modules; idempotent and fast once installed.
  - type: command
    command: pnpm install --frozen-lockfile --prefer-offline
  # Every task of the active change is ticked.
  - type: command
    command: >-
      if grep -rn '^[[:space:]]*- \[ \]' openspec/changes --include=tasks.md --exclude-dir=archive;
      then echo "the tasks listed above are still open - do them, then tick them in tasks.md"; exit 1; fi
  # Files this branch added or changed under packages/client/src stay under the 300-line hard cap.
  - type: command
    command: >-
      base=$(git merge-base HEAD origin/main);
      oversized=$({ git diff --name-only --diff-filter=AM "$base" -- packages/client/src;
      git ls-files -o --exclude-standard packages/client/src; } | sort -u |
      while read -r file; do [ -f "$file" ] && lines=$(wc -l < "$file") && [ "$lines" -gt 300 ] && echo "$file: $lines lines"; done);
      [ -z "$oversized" ] || { echo "$oversized"; echo "these files exceed the 300-line hard cap - split them, see .claude/rules/process-invariants.md"; exit 1; }
  - type: command
    command: pnpm lint
  - type: command
    command: pnpm typecheck
  - type: command
    command: pnpm test
  - type: command
    command: pnpm build
  - type: command
    command: pnpm --filter @time-zones/client check:bundle-size
  # BDD E2E via playwright-bdd; needs Chromium from `playwright install chromium` on this host.
  - type: command
    command: pnpm --filter @time-zones/client test:bdd
  # LLM judge grades the implementation against acceptance.md; read-only.
  - type: judge
    criteriaFile: stages/implement/acceptance.md
    model: sonnet
    settings:
      maxTurns: 15
      disallowedTools:
        - Bash
        - Agent
        - ScheduleWakeup
        - SendMessage
        - ToolSearch
        - Edit
        - Write
        - WebFetch
        - WebSearch
    # Judge runs; must be odd, majority wins.
    votes: 1
# auto = go to next stage; manual = wait for a human.
advancement: auto
