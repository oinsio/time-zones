<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Настройки при раскраске «По рабочему времени» — светлая</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* Design tokens of this screen: light theme, vivid day palette. */
:root {
  --color-background: #f7f7f5;
  --color-surface: #ffffff;
  --color-card-border: #a9adb8;
  --color-control-border: #8a8a93;
  --color-control-border-inactive: #c9ccd4;
  --color-foreground: #1c1c20;
  --color-muted-foreground: #60616c;
  --color-accent: #3159e7;
  --color-accent-foreground: #ffffff;
  --color-handle-border: #1c1c20;
  --color-notice: #fff4d6;
  --color-notice-foreground: #5c4300;
  --color-danger: #b42318;
  --color-day-non-working: #ececef;
  --color-midnight-shade: rgba(24, 24, 27, 0.10);
  --color-hour-cell-foreground: #1c1c20;
  --color-night-cell-foreground: #1c1c20;
  --color-meeting: #00aa00;
  --color-meeting-text: #008800;
  --color-meeting-bar: #e0f5e0;
  --color-day-night: #a4afd4;
  --color-day-morning: #f0c6b8;
  --color-day-daylight: #f8e5a0;
  --color-day-evening: #e8c7df;
  --handle-border-width: 2px;
  --lift-shadow: 0 8px 24px rgba(24,24,27,.18);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #d9d9d4; display: flex; justify-content: center; font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
svg.icon { display: block; flex-shrink: 0; }
#screen { width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--color-background); color: var(--color-foreground); position: relative; }
.column { width: 100%; max-width: 1120px; margin: 0 auto; }
/* Header: title left, both actions right, no divider line */
.header { display: flex; align-items: center; justify-content: space-between; padding: 24px 16px 20px; }
.title { margin: 0; font-size: 27px; line-height: 32px; font-weight: 700; letter-spacing: -0.5px; }
.header-actions { display: flex; color: var(--color-accent); }
.icon-button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.header-actions .icon-button:last-child { margin-right: -8px; }
/* Location list */
.cards { display: flex; flex-direction: column; gap: 12px; padding: 0 13px; }
.card { background: var(--color-surface); border: 1px solid var(--color-card-border); border-radius: 14px; padding: 10px 15px 11px; position: relative; }
.card-head { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 9px; }
.place { display: flex; flex-wrap: wrap; align-items: center; column-gap: 9px; flex: 1 1 0; min-width: min-content; }
.mark { color: var(--color-accent); align-self: center; }
.city { margin: 0; font-size: 24px; line-height: 33px; font-weight: 700; letter-spacing: -0.4px; min-width: 0; }
.difference { font-size: 16px; font-weight: 600; color: var(--color-muted-foreground); white-space: nowrap; }
.time-group { display: flex; align-items: flex-start; margin-left: auto; }
.time { font-size: 26px; line-height: 33px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.day-half { font-size: 14px; font-weight: 700; margin-left: 4px; }
.menu-button { margin: 5px -4px 0 14px; }
.card-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 1px; }
.zone-line, .date { color: var(--color-muted-foreground); font-size: 14px; line-height: 21px; }
.date { white-space: nowrap; }
/* Zone line: parts joined by a middle dot; a dot at a line break is not shown */
.zone-line { display: block; overflow: hidden; }
.zone-parts { display: flex; flex-wrap: wrap; margin-left: -14px; }
.zone-part { position: relative; padding-left: 14px; }
.zone-part::before { content: "·"; position: absolute; left: 5px; }
.zone-part:not(:first-child) { white-space: nowrap; }
/* Day track: 12 px bar, 23 px visible handle, 44 px hit area */
.day-track { position: relative; height: 23px; margin-top: 12px; }
.day-track-bar { position: absolute; left: 0; right: 0; top: 5.5px; height: 12px; border-radius: 9999px; }
.day-track-handle { position: absolute; top: 0; width: 23px; height: 23px; margin-left: -11.5px; border-radius: 50%; background: var(--color-surface); border: var(--handle-border-width) solid var(--color-handle-border); }
.hour-labels { position: relative; height: 16px; margin-top: 3px; font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.hour-label { position: absolute; top: 0; white-space: nowrap; }
.row-note { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; padding: 8px 12px; border-radius: 6px; background: var(--color-notice); color: var(--color-notice-foreground); font-size: 13px; line-height: 1.375; }
.row-note svg { margin-top: 1px; }
/* Wide card (from 768 px): header line, then the track across the card */
.wide .header { padding: 24px 20px 20px; }
.wide .cards { padding: 0 16px; }
.wide .card { padding: 12px 20px 12px; }
.wide .card-head { flex-wrap: nowrap; align-items: center; column-gap: 14px; }
.wide .place { align-items: baseline; column-gap: 10px; }
.wide .city { font-size: 26px; }
.wide .zone-line { font-size: 15px; flex: 1 1 200px; }
.wide .date { font-size: 15px; }
.wide .time { font-size: 28px; }
.wide .menu-button { margin: 0 -4px 0 0; }
.wide .day-track { margin-top: 6px; }
/* Date bar: page background, no top line, one centred group */
.spacer { flex: 1; }
.date-bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px; background: var(--color-background); }
.date-nav { display: flex; align-items: center; }
.date-button { font-size: 16px; font-weight: 700; padding: 0 4px; white-space: nowrap; }
.now { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid var(--color-control-border); border-radius: 13px; font-size: 16px; font-weight: 600; white-space: nowrap; }
.now.inactive { border-color: var(--color-control-border-inactive); color: var(--color-muted-foreground); }
/* Location menu */
.menu { position: absolute; right: 12px; top: 46px; z-index: 5; min-width: 200px; padding: 4px 0; border-radius: 10px; border: 1px solid var(--color-control-border); background: var(--color-surface); box-shadow: var(--lift-shadow); display: flex; flex-direction: column; }
.menu-item { min-height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 15px; }
.menu-item.disabled { color: var(--color-muted-foreground); opacity: 0.55; }
.card.lifted { transform: translateY(-104px) scale(1.02); box-shadow: var(--lift-shadow); z-index: 4; }
.card.shifted { transform: translateY(126px); }
/* Grid */
.grid-panel { list-style: none; margin: 0 13px; padding: 0; position: relative; background: var(--color-surface); border: 1px solid var(--color-card-border); border-radius: 14px; overflow: hidden; }
.wide .grid-panel { margin: 0 16px; }
.grid-row { padding: 12px 14px 14px; border-top: 1px solid var(--color-card-border); }
.grid-row:first-child { border-top: 0; }
.wide .grid-row { padding: 12px 20px 14px; }
.grid-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; position: relative; z-index: 2; }
.grid-head .place { align-items: baseline; }
.grid-head .city, .grid-head .difference, .grid-head .zone-part, .grid-head .date, .grid-head .time { background: var(--color-surface); }
.grid-head .city { font-size: 20px; line-height: 26px; }
.wide .grid-head .city { font-size: 22px; }
.grid-head .time { font-size: 24px; line-height: 1.15; }
.wide .grid-head .time { font-size: 26px; }
.grid-head .time.meeting-span { color: var(--color-meeting-text); font-size: 20px; }
.wide .grid-head .time.meeting-span { font-size: 26px; }
.grid-head .date-time { display: flex; flex-direction: column; align-items: flex-end; }
.wide .grid-head .date-time { flex-direction: row; align-items: baseline; gap: 12px; }
.grid-head .menu-button { margin: 0 -4px 0 0; }
.day-shift { background: var(--color-surface); color: var(--color-danger); font-size: 14px; font-weight: 700; white-space: nowrap; }
.hour-strip { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; }
.narrow .hour-strip-window { overflow: hidden; margin: 0 -14px; }
.narrow .hour-strip { display: flex; width: max-content; }
.hour-cell { height: 48px; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 15px; line-height: 1.1; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--color-hour-cell-foreground); position: relative; }
.hour-cell.night { color: var(--color-night-cell-foreground); }
.hour-cell.accent { color: var(--color-accent-foreground); }
.hour-cell small { font-size: 10px; font-weight: 600; line-height: 1; }
.hour-cell.midnight { box-shadow: inset 0 0 0 999px var(--color-midnight-shade); }
.hour-cell.midnight small { font-size: 9px; font-weight: 700; }
.hour-cell.current, .hour-cell.in-meeting { font-weight: 800; }
.hour-cell.dimmed { opacity: 0.4; }
.narrow .hour-cell { width: 38px; flex: none; height: 44px; }
.hour-cell.dst-edge::before { content: ""; position: absolute; left: -2.5px; top: 0; bottom: 0; width: 2px; background: var(--color-foreground); }
.frame { position: absolute; top: 6px; bottom: 6px; border: 2px solid var(--color-accent); border-radius: 9px; z-index: 1; pointer-events: none; }
.frame.meeting { border-color: var(--color-meeting); }
.meeting-handle { position: absolute; width: 12px; height: 36px; margin: -18px 0 0 -6px; border-radius: 4px; background: var(--color-meeting); z-index: 3; }
.meeting-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 24px 20px 20px; background: var(--color-meeting-bar); border-bottom: 1px solid var(--color-meeting); margin-bottom: 12px; }
.narrow .meeting-bar { padding: 24px 16px 20px; }
.meeting-bar .title { grid-column: 2; font-size: 24px; font-weight: 600; letter-spacing: 0; }
.meeting-bar .header-actions { color: var(--color-meeting); justify-self: end; }
.grid-row .row-note { position: relative; z-index: 2; }
/* Settings page: built layout with the new tokens; the Colours group is new */
.settings-header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; margin: 0 16px; padding: 24px 0 16px; border-bottom: 1px solid var(--color-control-border); }
.settings-title { margin: 0; text-align: center; font-size: 24px; line-height: 32px; font-weight: 600; }
.settings { width: 100%; max-width: 576px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
.credit { align-self: center; color: var(--color-accent); text-decoration: underline; font-size: 16px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.settings-caption { font-size: 14px; font-weight: 600; color: var(--color-muted-foreground); }
.segmented { display: flex; border: 1px solid var(--color-control-border); border-radius: 6px; background: var(--color-surface); }
.option { min-width: 44px; min-height: 44px; padding: 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--color-accent); white-space: nowrap; }
.option.checked { background: var(--color-accent); color: var(--color-accent-foreground); }
.palette-swatch { display: flex; width: 24px; height: 24px; border-radius: 5px; overflow: hidden; outline: 2px solid var(--color-surface); }
.palette-swatch span { flex: 1; }
.settings-block { display: flex; flex-direction: column; gap: 8px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--color-accent); border-radius: 6px; background: var(--color-surface); font-size: 14px; font-weight: 600; }
.toggle svg { color: var(--color-accent); }
.zone-example { font-size: 14px; color: var(--color-muted-foreground); }
.language-button { min-height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--color-control-border); border-radius: 6px; background: var(--color-surface); color: var(--color-foreground); }
.language-button svg { color: var(--color-accent); }
.time-field { min-height: 44px; width: 96px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-control-border); border-radius: 6px; background: var(--color-surface); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.time-range { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.footnote { margin: 0; text-align: center; font-size: 14px; color: var(--color-accent); }
</style>
</head>
<body>
<div id="screen" class="narrow" data-theme="light" data-day-palette="vivid">
<header class="settings-header"><span class="icon-button" style="color: var(--color-accent)" aria-label="Назад"><svg class="icon " data-lucide="chevron-left" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></span><h1 class="settings-title">Настройки</h1><span style="min-width: 44px"></span></header><main class="settings"><span class="credit">Создано с помощью Gnomish Factory</span><div class="settings-row"><span class="settings-caption">Тема</span><div class="segmented"><span class="option checked" title="Системная"><svg class="icon" data-lucide="monitor" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg></span><span class="option" title="Светлая"><svg class="icon" data-lucide="sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span><span class="option" title="Тёмная"><svg class="icon" data-lucide="moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></span></div></div><div class="settings-row"><span class="settings-caption">Формат времени</span><div class="segmented"><span class="option" title="12 часов">12</span><span class="option checked" title="24 часа">24</span></div></div><div class="settings-row"><span class="settings-caption">Вид</span><div class="segmented"><span class="option checked" title="Карточки">Карточки</span><span class="option" title="Сетка">Сетка</span></div></div><div class="settings-row"><span class="settings-caption">Раскраска</span><div class="segmented"><span class="option" title="Обычная"><svg class="icon" data-lucide="paint-bucket" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 7 6 2"/><path d="M18.992 12H2.041"/><path d="M21.145 18.38A3.34 3.34 0 0 1 20 16.5a3.3 3.3 0 0 1-1.145 1.88c-.575.46-.855 1.02-.855 1.595A2 2 0 0 0 20 22a2 2 0 0 0 2-2.025c0-.58-.285-1.13-.855-1.595"/><path d="m8.5 4.5 2.148-2.148a1.205 1.205 0 0 1 1.704 0l7.296 7.296a1.205 1.205 0 0 1 0 1.704l-7.592 7.592a3.615 3.615 0 0 1-5.112 0l-3.888-3.888a3.615 3.615 0 0 1 0-5.112L5.67 7.33"/></svg></span><span class="option" title="По времени суток"><svg class="icon" data-lucide="sun-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2"/><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"/><path d="M16 12a4 4 0 0 0-4-4"/><path d="m19 5-1.256 1.256"/><path d="M20 12h2"/></svg></span><span class="option checked" title="По рабочему времени"><svg class="icon" data-lucide="briefcase-business" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M22 13a18.15 18.15 0 0 1-20 0"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg></span></div></div><div class="settings-row"><span class="settings-caption">Рабочие часы</span><div class="time-range"><span class="time-field">10:00</span>–<span class="time-field">18:00</span></div></div><div class="settings-block"><span class="settings-caption">Обозначение часового пояса</span><div class="toggles"><span class="toggle"><svg class="icon" data-lucide="check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Страна</span><span class="toggle"><svg class="icon" data-lucide="check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Аббревиатура</span><span class="toggle"><svg class="icon" data-lucide="check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Смещение UTC</span></div><div class="zone-example"><span class="zone-line" data-zone-line><span class="zone-parts"><span class="zone-part">Россия</span><span class="zone-part">МСК</span><span class="zone-part">UTC+3</span></span></span></div></div><div class="settings-block"><span class="settings-caption">Язык</span><span class="language-button"><span>🇷🇺</span><span style="flex: 1; font-weight: 600">Русский</span><svg class="icon" data-lucide="chevron-down" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></div><p class="footnote">Развёрнуто 19 ноября 2026 г. в 01:44</p><p class="footnote">Правила часовых поясов: 2026f</p></main>
</div>
